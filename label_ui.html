<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Blind labels</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      max-width: 100%;
      overflow-x: hidden;
      font-family: system-ui, sans-serif;
      background: #f6f4ef;
      color: #1b1b1b;
    }
    main {
      width: 100%;
      max-width: 36rem;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 { font-size: 1.1rem; margin: 0 0 0.75rem; }
    .counts { font-size: 0.9rem; margin-bottom: 1rem; }
    .error {
      background: #fde8e8;
      color: #8a1f1f;
      padding: 0.75rem;
      margin-bottom: 1rem;
      word-break: break-word;
    }
    .card {
      background: #fff;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #d8d2c4;
    }
    .meta { font-size: 0.8rem; color: #555; margin-bottom: 0.5rem; word-break: break-word; }
    a.title {
      display: block;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 0.75rem;
      color: #0b57d0;
      word-break: break-word;
    }
    .summary {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }
    fieldset {
      border: 0;
      padding: 0;
      margin: 0 0 0.85rem;
    }
    legend { font-weight: 600; margin-bottom: 0.4rem; }
    .choices { display: flex; gap: 0.5rem; }
    button.choice, button.save {
      flex: 1;
      min-height: 2.75rem;
      font-size: 1rem;
      border: 1px solid #bbb;
      background: #fff;
      padding: 0.5rem;
    }
    button.choice[aria-pressed="true"] { background: #1b1b1b; color: #fff; }
    button.save {
      width: 100%;
      background: #1b1b1b;
      color: #fff;
      margin-top: 0.5rem;
    }
    button.save:disabled { opacity: 0.4; }
    textarea {
      width: 100%;
      min-height: 4rem;
      font: inherit;
      padding: 0.5rem;
      max-width: 100%;
    }
    .hint { font-size: 0.8rem; color: #555; margin-top: 0.75rem; }
    .empty { padding: 1rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Blind labels</h1>
    <div id="counts" class="counts"></div>
    <div id="error" class="error" hidden></div>
    <div id="empty" class="empty" hidden>Queue is empty.</div>
    <section id="panel" hidden>
      <article class="card">
        <div id="meta" class="meta"></div>
        <a id="title" class="title" target="_blank" rel="noopener noreferrer"></a>
        <div id="summary" class="summary"></div>
      </article>
      <form id="form">
        <fieldset>
          <legend>Relevant</legend>
          <div class="choices">
            <button type="button" class="choice" data-field="relevant" data-value="yes" aria-pressed="false">Yes (1)</button>
            <button type="button" class="choice" data-field="relevant" data-value="no" aria-pressed="false">No (2)</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Duplicate</legend>
          <div class="choices">
            <button type="button" class="choice" data-field="duplicate" data-value="yes" aria-pressed="false">Yes (3)</button>
            <button type="button" class="choice" data-field="duplicate" data-value="no" aria-pressed="false">No (4)</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Needs correction</legend>
          <div class="choices">
            <button type="button" class="choice" data-field="needs_correction" data-value="yes" aria-pressed="false">Yes (5)</button>
            <button type="button" class="choice" data-field="needs_correction" data-value="no" aria-pressed="false">No (6)</button>
          </div>
        </fieldset>
        <label for="notes">Note (optional, 200)</label>
        <textarea id="notes" maxlength="200"></textarea>
        <button type="submit" class="save" id="save" disabled>Save (Enter)</button>
      </form>
      <p class="hint">1/2 relevant, 3/4 duplicate, 5/6 correction, Enter save. Unlabeled items stay in the queue.</p>
    </section>
  </main>
  <script>
    const state = { relevant: null, duplicate: null, needs_correction: null, id: null };
    const errorEl = document.getElementById("error");
    const countsEl = document.getElementById("counts");
    const emptyEl = document.getElementById("empty");
    const panelEl = document.getElementById("panel");
    const saveEl = document.getElementById("save");

    function showError(text) {
      errorEl.hidden = !text;
      errorEl.textContent = text || "";
    }

    function complete() {
      return state.relevant !== null && state.duplicate !== null && state.needs_correction !== null && state.id;
    }

    function renderCounts(counts) {
      if (!counts) {
        countsEl.textContent = "";
        return;
      }
      countsEl.textContent =
        "Remaining " + counts.remaining +
        " · today " + counts.labeled_today +
        " · week " + counts.labeled_week;
    }

    function setChoice(field, value) {
      state[field] = value;
      document.querySelectorAll('button.choice[data-field="' + field + '"]').forEach(function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-value") === value ? "true" : "false");
      });
      saveEl.disabled = !complete();
    }

    function resetForm() {
      state.relevant = null;
      state.duplicate = null;
      state.needs_correction = null;
      document.querySelectorAll("button.choice").forEach(function (btn) {
        btn.setAttribute("aria-pressed", "false");
      });
      document.getElementById("notes").value = "";
      saveEl.disabled = true;
    }

    function showItem(item) {
      resetForm();
      if (!item) {
        state.id = null;
        panelEl.hidden = true;
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;
      panelEl.hidden = false;
      state.id = item.id;
      document.getElementById("meta").textContent =
        [item.id, item.workflow, item.posted_at, item.hn_id].filter(Boolean).join(" · ");
      const title = document.getElementById("title");
      title.textContent = item.title || item.id;
      title.href = item.url || "#";
      document.getElementById("summary").textContent = item.summary || "";
    }

    async function loadNext() {
      showError("");
      try {
        const res = await fetch("/api/next", { cache: "no-store" });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || "Store unavailable");
          panelEl.hidden = true;
          emptyEl.hidden = true;
          return;
        }
        renderCounts(data.counts);
        showItem(data.item);
      } catch (err) {
        showError("Store unavailable");
        panelEl.hidden = true;
        emptyEl.hidden = true;
      }
    }

    async function save(event) {
      if (event) event.preventDefault();
      if (!complete()) {
        showError("Choose relevant, duplicate, and correction first.");
        return;
      }
      showError("");
      saveEl.disabled = true;
      try {
        const res = await fetch("/api/label", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: state.id,
            relevant: state.relevant,
            duplicate: state.duplicate,
            needs_correction: state.needs_correction,
            notes: document.getElementById("notes").value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || "Could not save");
          saveEl.disabled = !complete();
          return;
        }
        renderCounts(data.counts);
        showItem(data.item);
      } catch (err) {
        showError("Store unavailable");
        saveEl.disabled = !complete();
      }
    }

    document.querySelectorAll("button.choice").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setChoice(btn.getAttribute("data-field"), btn.getAttribute("data-value"));
      });
    });
    document.getElementById("form").addEventListener("submit", save);
    document.addEventListener("keydown", function (event) {
      if (event.target && event.target.id === "notes" && event.key !== "Enter") return;
      const map = {
        "1": ["relevant", "yes"],
        "2": ["relevant", "no"],
        "3": ["duplicate", "yes"],
        "4": ["duplicate", "no"],
        "5": ["needs_correction", "yes"],
        "6": ["needs_correction", "no"]
      };
      if (map[event.key]) {
        event.preventDefault();
        setChoice(map[event.key][0], map[event.key][1]);
      } else if (event.key === "Enter" && event.target.id !== "notes") {
        event.preventDefault();
        save();
      }
    });
    loadNext();
  </script>
</body>
</html>
